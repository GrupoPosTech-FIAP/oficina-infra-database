# This is a basic workflow to help you get started with Actions

name: "RDS - CI/CD"

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  # push:
  #   branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      TF_BUCKET_NAME:
        description: "Nome do bucket S3 (mesmo usado no oficina-infra-cluster)"
        required: true
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Configurar Credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Essencial para Learner Lab
          aws-region: "us-east-1"

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ inputs.TF_BUCKET_NAME }}"

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="infra_state_bucket=${{ inputs.TF_BUCKET_NAME }}" \
            -var="db_password=${{ secrets.RDS_PASSWORD }}"

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="infra_state_bucket=${{ inputs.TF_BUCKET_NAME }}" \
            -var="db_password=${{ secrets.RDS_PASSWORD }}"

      - name: Exibir endpoint do RDS
        run: |
          echo "✅ RDS provisionado com sucesso!"
          echo "DB_Endpoint: $(terraform output -raw DB_Endpoint)"
          echo ""
          echo "⚠️  Copie o DB_Endpoint acima e use como input no deploy da aplicação (Tech-Challenge-15SOAT)."
